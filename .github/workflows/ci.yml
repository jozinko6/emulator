name: CI + Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  web-quality:
    name: Web — Type-check, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json is missing. Run 'npm install' locally first."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build web (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jaňo še chce bavkac"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: .next/standalone
          retention-days: 7

  android-build:
    name: Android — Build Debug APK
    runs-on: ubuntu-latest
    needs: web-quality
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install web dependencies
        run: npm ci

      - name: Build Android web shell (Vite)
        run: npm run android:web
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jaňo še chce bavkac"

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was produced by Gradle"
            exit 1
          fi
          echo "APK built successfully: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Rename APK to stable name
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK_PATH" jano-se-chce-bavkac.apk
          sha256sum jano-se-chce-bavkac.apk | awk '{print $1}' > jano-se-chce-bavkac.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jano-se-chce-bavkac-android-apk
          path: |
            jano-se-chce-bavkac.apk
            jano-se-chce-bavkac.apk.sha256
          retention-days: 30

  android-release:
    name: Android — Build + Sign Release APK
    runs-on: ubuntu-latest
    needs: android-build
    # Only on tags
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install web dependencies
        run: npm ci

      - name: Build Android web shell
        run: npm run android:web
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jaňo še chce bavkac"

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set — building unsigned release"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/release.keystore ]; then
            cat > android/gradle.properties << EOF
            RELEASE_STORE_FILE=../release.keystore
            RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
            RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
            RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
            EOF
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Compute SHA-256
        id: sha
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found"
            exit 1
          fi
          cp "$APK_PATH" jano-se-chce-bavkac.apk
          SHA=$(sha256sum jano-se-chce-bavkac.apk | awk '{print $1}')
          SIZE=$(stat -c %s jano-se-chce-bavkac.apk)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jano-se-chce-bavkac.apk
          body: |
            # Jaňo še chce bavkac — Android APK

            - **Veľkosť:** ${{ steps.sha.outputs.size }} bytes
            - **SHA-256:** `${{ steps.sha.outputs.sha256 }}`
            - **Min. Android:** Android 8 (API 26)
            - **Build:** ${{ github.sha }}

            ## Stabilný download odkaz

            ```
            https://github.com/jozinko6/emulator/releases/latest/download/jano-se-chce-bavkac.apk
            ```

            ## Inštalácia
            1. Stiahnite APK do Android zariadenia.
            2. Povoľte inštaláciu z neznámych zdrojov.
            3. Otvorte APK a potvrďte inštaláciu.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
