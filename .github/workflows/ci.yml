name: CI + Android Build

on:
  push:
    branches: [main, master, fix/final-runtime-integration]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  web-quality:
    name: Web - Type-check, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jano se chce bavkac"

  android-build:
    name: Android - Build Debug APK
    runs-on: ubuntu-latest
    needs: web-quality
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install web dependencies
        run: npm ci

      - name: Build Android web shell
        run: npm run android:web
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jano se chce bavkac"

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify and package debug APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No debug APK was produced by Gradle"
            exit 1
          fi
          cp "$APK_PATH" jano-se-chce-bavkac-debug.apk
          sha256sum jano-se-chce-bavkac-debug.apk | tee jano-se-chce-bavkac-debug.apk.sha256
          ls -lh jano-se-chce-bavkac-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jano-se-chce-bavkac-debug-apk
          path: |
            jano-se-chce-bavkac-debug.apk
            jano-se-chce-bavkac-debug.apk.sha256
          retention-days: 30

  android-release:
    name: Android - Build + Sign Release APK
    runs-on: ubuntu-latest
    needs: android-build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Verify release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: required signing secret $name is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install web dependencies
        run: npm ci

      - name: Build Android web shell
        run: npm run android:web
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jano se chce bavkac"

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/gradle.properties << EOF
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Verify signature and compute SHA-256
        id: sha
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found"
            exit 1
          fi
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK_PATH"
          else
            echo "ERROR: apksigner is not available"
            exit 1
          fi
          cp "$APK_PATH" jano-se-chce-bavkac.apk
          SHA=$(sha256sum jano-se-chce-bavkac.apk | awk '{print $1}')
          SIZE=$(stat -c %s jano-se-chce-bavkac.apk)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jano-se-chce-bavkac.apk
          body: |
            # Jano se chce bavkac - Android APK

            - Size: ${{ steps.sha.outputs.size }} bytes
            - SHA-256: `${{ steps.sha.outputs.sha256 }}`
            - Min. Android: Android 8 (API 26)
            - Build: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
