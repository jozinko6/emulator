name: CI + Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  web-quality:
    name: Web — Type-check, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build web (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jaňo še chce bavkac"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: .next/standalone
          retention-days: 7

  android-build:
    name: Android — Build + Sign APK
    runs-on: ubuntu-latest
    needs: web-quality
    # Only build APK on tags or pushes to main (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install web dependencies
        run: npm ci

      - name: Build Next.js static export for Android WebView
        run: npx next build
        env:
          NEXT_PUBLIC_ENABLE_PS2: "false"
          NEXT_PUBLIC_APP_NAME: "Jaňo še chce bavkac"
          NEXT_PUBLIC_ANDROID_DOWNLOAD_ENABLED: "false"

      - name: Install Capacitor CLI
        run: npm install -D @capacitor/cli

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/gradle.properties << EOF
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Compute SHA-256
        id: sha
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(stat -c %s "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jano-se-chce-bavkac-android-apk
          path: ${{ steps.sha.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.apk_path }}
          body: |
            # Jaňo še chce bavkac — Android APK

            - **Veľkosť:** ${{ steps.sha.outputs.size }} bytes
            - **SHA-256:** `${{ steps.sha.outputs.sha256 }}`
            - **Min. Android:** Android 8 (API 26)
            - **Build:** ${{ github.sha }}

            ## Inštalácia
            1. Stiahnite APK do Android zariadenia.
            2. Povoľte inštaláciu z neznámych zdrojov.
            3. Otvorte APK a potvrďte inštaláciu.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update static release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > public/downloads/android-release.json << EOF
          {
            "enabled": true,
            "version": "${GITHUB_REF_NAME}",
            "versionCode": 1,
            "mobileApkUrl": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/jano-se-chce-bavkac.apk",
            "tvApkUrl": "",
            "universalApkUrl": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/jano-se-chce-bavkac.apk",
            "sizeBytes": ${{ steps.sha.outputs.size }},
            "sha256": "${{ steps.sha.outputs.sha256 }}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minAndroidVersion": "Android 8 (API 26)"
          }
          EOF
