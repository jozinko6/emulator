<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jaňo še chce bavkac — Offline</title>
  <style>
    body {
      background: #0a0a14;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .box { max-width: 28rem; }
    h1 {
      color: #f5b73d;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      margin: 0 0 1rem;
    }
    p {
      color: #a0a0b0;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      background: #f5b73d;
      color: #0a0a14;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Jaňo še chce bavkac</h1>
    <p>
      Aktuálne ste offline. Knižnica a uložené hry zostávajú dostupné po obnovení pripojenia.
      Herné súbory sa nachádzajú v lokálnom úložisku vášho zariadenia.
    </p>
    <a href="/">Skúsiť znova</a>
  </div>
</body>
</html>
