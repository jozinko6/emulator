apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "sk.jano.bavkac"
    compileSdkVersion 34

    defaultConfig {
        applicationId "sk.jano.bavkac"
        minSdkVersion 26  // Android 8.0
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        // Android TV support
        bundle {
            density { enableSplit = true }
            abi { enableSplit = true }
            language { enableSplit = true }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing config injected from CI secrets via gradle.properties
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }

    // Required for Capacitor
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Bundle assets inside the APK — offline-ready
    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }

    // Keep emulator WASM cores in the APK
    packagingOptions {
        resources {
            excludes += ['META-INF/*.version']
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Gamepad support (KeyEvent / MotionEvent helpers)
    implementation 'androidx.core:core-ktx:1.12.0'
}
